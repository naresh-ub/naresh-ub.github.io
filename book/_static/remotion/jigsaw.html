<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Jigsaw Puzzle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" />
    <style>
      /* No internal scrolling; height comes from content for perfect embedding */
      html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
      #root { display: block; }
      *, *::before, *::after { box-sizing: border-box; }
    </style>
    <script type="module" crossorigin src="./assets/jigsaw-DXxEByK7.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/index-iUq02wVG.js">
  </head>
  <body>
    <div id="root"></div>

    <script>
      // Post actual height to parent so an iframe can size itself exactly
      (function () {
        const target = document.getElementById("root");
        let last = 0;
        const measure = () => Math.ceil(target?.getBoundingClientRect().height || 0);
        const send = () => {
          const h = measure();
          if (h && h !== last) {
            last = h;
            parent.postMessage({ type: "remotion:height", value: h }, "*");
          }
        };
        window.addEventListener("load", send);
        window.addEventListener("resize", send);
        const ro = new ResizeObserver(send);
        ro.observe(document.documentElement);
        ro.observe(document.body);
        if (target) ro.observe(target);
        const mo = new MutationObserver(send);
        mo.observe(document.documentElement, { childList: true, subtree: true, attributes: true });
        document.fonts?.ready?.then(send);
        window.addEventListener("message", (e) => { if (e.data?.type === "remotion:get-height") send(); });
        let ticks = 0; const raf = () => { if (ticks++ < 30) { send(); requestAnimationFrame(raf); } };
        requestAnimationFrame(raf);
      })();
    </script>
  </body>
</html>
